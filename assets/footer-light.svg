<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176" width="1000" height="176" role="img" aria-label="Thanks for stopping by — turning ideas into code, one soft pixel at a time."><title>Thanks for stopping by — turning ideas into code, one soft pixel at a time.</title><style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.b{font-weight:700} .sb{font-weight:600}
.hop{animation:hop 2.2s ease-in-out infinite}@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
@keyframes tw{0%,100%{opacity:.4;transform:scale(.7)}50%{opacity:1;transform:scale(1) rotate(25deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style><defs><linearGradient id="fb" x1="0" x2="1"><stop offset="0" stop-color="#FFF3E8"/><stop offset=".5" stop-color="#FFFDF8"/><stop offset="1" stop-color="#EAF7F0"/></linearGradient></defs><rect x="1" y="1" width="998" height="174" rx="26" fill="url(#fb)" stroke="#ECE3EE" stroke-width="1.5"/><line x1="472.0" y1="62" x2="528.0" y2="62" stroke="#8447C2" stroke-width="3" stroke-linecap="round" opacity=".7"/><text x="500.0" y="104" class="sans b" fill="#293247" font-size="30" text-anchor="middle" letter-spacing="-0.3">Thanks for stopping by</text><text x="500.0" y="136" class="sans" fill="#59617A" font-size="18" text-anchor="middle" >Turning ideas into code — one soft pixel at a time.</text></svg>