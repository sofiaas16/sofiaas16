# 🐍 Pastel contribution snake
# Builds a pink/lavender snake that eats Sara's real contribution graph and
# publishes it to the `output` branch (the README reads it from there).
name: 🐍 Pastel snake

on:
  schedule:
    - cron: "23 5 * * *"   # every day ~00:23 Bogotá time
  workflow_dispatch:         # run it by hand from the Actions tab
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write            # only needed to push to the `output` branch

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate pastel snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots = 5 colours: no contributions → most contributions
          outputs: |
            dist/pastel-snake-light.svg?color_snake=#E58FB4&color_dots=#F2EEF5,#FFE1CC,#F8BBD0,#D8B4F8,#A9C7F2&color_dot_border=#00000008
            dist/pastel-snake-dark.svg?color_snake=#A2D2FF&color_dots=#1E2438,#4A3550,#8C6A9E,#CDB4DB,#F8BBD0&color_dot_border=#FFFFFF08

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update pastel snake 🐍"
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
