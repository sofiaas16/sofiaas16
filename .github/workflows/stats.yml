# 📊 Pastel GitHub stats
# Generates the stats + top-languages cards inside this repo (profile/*.svg),
# so the README never depends on the public, often rate-limited, stats server.
name: 📊 Pastel stats

on:
  schedule:
    - cron: "41 6 * * *"   # every day ~01:41 Bogotá time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/stats.yml]

permissions:
  contents: write            # commit the refreshed SVGs; GITHUB_TOKEN only, no personal token needed

concurrency:
  group: stats
  cancel-in-progress: true

env:
  COMMON: "border_radius=18&hide_border=false&disable_animations=false"
  LIGHT: "bg_color=FFFBFD&border_color=ECE3EE&title_color=B83E76&text_color=293247&icon_color=74519B&ring_color=CDB4DB"
  DARK: "bg_color=1A2033&border_color=2D3551&title_color=F8BBD0&text_color=F4F1F8&icon_color=CDB4DB&ring_color=A2D2FF"

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&custom_title=Sara's%20GitHub%20stats&${{ env.COMMON }}&${{ env.LIGHT }}
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&custom_title=Sara's%20GitHub%20stats&${{ env.COMMON }}&${{ env.DARK }}
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&custom_title=Most%20used%20languages&${{ env.COMMON }}&${{ env.LIGHT }}
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&custom_title=Most%20used%20languages&${{ env.COMMON }}&${{ env.DARK }}
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh pastel stats 📊" || exit 0
          git push
