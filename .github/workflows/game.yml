# 🎮 Pastel Snake — published from this same profile repo (game/ folder)
# Lives at https://sofiaas16.github.io/sofiaas16/
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: 🎮 Deploy Pastel Snake

on:
  push:
    branches: [main]
    paths: [game/**, .github/workflows/game.yml]
  workflow_dispatch:

# Minimum permissions needed to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run game logic tests
        run: node game/tests/game.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Collect site files (only the game, nothing else from the repo)
        run: |
          mkdir -p _site
          cp game/index.html game/style.css game/game.js game/main.js game/favicon.svg _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
